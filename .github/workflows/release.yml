# Push a tag like v1.2.3 to build the macOS, Fedora, and Arch packages and publish a GitHub release.
# The app checks /releases/latest, so the release is created only after all packages are built.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ github.ref_name }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/revisor-app/Cargo.toml)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match crates/revisor-app version $version." >&2; exit 1; }

  macos:
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - env:
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
          REVISOR_SIGNING_IDENTITY: ${{ vars.REVISOR_SIGNING_IDENTITY }}
        run: |
          rustup update stable --no-self-update
          ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            target/dist/Revisor-*.dmg
            target/dist/Revisor-*-macos-arm64.tar.gz

  fedora:
    needs: check
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - run: dnf -q install -y git
      - uses: actions/checkout@v7
      - env:
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
        run: |
          sh scripts/fedora-build-deps.sh
          export PATH="$CARGO_HOME/bin:$PATH" CARGO_TARGET_DIR="$PWD/target/fedora-x86_64"
          mkdir -p target/dist
          sh scripts/package-fedora-in-container.sh
      - uses: actions/upload-artifact@v7
        with:
          name: fedora
          path: target/dist/revisor-*.x86_64.rpm

  arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - env:
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
        run: |
          sh scripts/arch-build-deps.sh
          useradd -m builder
          chown -R builder:builder .
          su -s /bin/sh builder -c 'export HOME=/home/builder CARGO_TARGET_DIR="$PWD/target/arch-x86_64"; sh scripts/package-arch-in-container.sh'
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: target/dist/revisor-[0-9]*-x86_64.pkg.tar.zst

  publish:
    needs: [macos, fedora, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          git log --no-merges --format='- %s' "${previous:+$previous..}$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md dist/*
