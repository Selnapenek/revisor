# Push a tag like v1.2.3 to build the macOS, Fedora, and Arch packages and publish a release.
# The app checks /releases/latest, so the release stays a draft until all packages are uploaded.
# Needs runners with the labels `macos` (Apple Silicon Mac, host mode, Rust installed) and `ubuntu-latest`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TAG: ${{ gitea.ref_name }}
  TOKEN: ${{ gitea.token }}
  API: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}
  REPO_URL: ${{ gitea.server_url }}/${{ gitea.repository }}.git

jobs:
  draft:
    runs-on: ubuntu-latest
    container: alpine:3
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        run: |
          apk add --no-cache curl git jq
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64)"
          git -c http.extraHeader="$auth" clone --quiet --filter=blob:none --no-checkout "$REPO_URL" src
          cd src

          version=$(git show "$TAG:crates/revisor-app/Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p')
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match crates/revisor-app version $version." >&2; exit 1; }

          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          notes=$(git log --no-merges --format='- %s' "${previous:+$previous..}$TAG")
          body=$(jq -n --arg tag "$TAG" --arg notes "$notes" '{tag_name: $tag, name: $tag, body: $notes, draft: true}')
          id=$(curl -fsS -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' -d "$body" "$API/releases" | jq -r .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  macos:
    needs: draft
    runs-on: macos
    steps:
      - env:
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
          REVISOR_SIGNING_IDENTITY: ${{ vars.REVISOR_SIGNING_IDENTITY }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rm -rf src
          git clone --quiet --depth 1 --branch "$TAG" "$REPO_URL" src
          cd src
          ./scripts/package-macos.sh
          for file in target/dist/Revisor-*.dmg target/dist/Revisor-*-macos-arm64.tar.gz; do
            curl -fsS -o /dev/null -H "Authorization: token $TOKEN" -F "attachment=@$file" \
              "$API/releases/$RELEASE_ID/assets?name=$(basename "$file")"
          done

  fedora:
    needs: draft
    runs-on: ubuntu-latest
    container: fedora:43
    env:
      CARGO_HOME: /opt/cargo
      RUSTUP_HOME: /opt/rustup
    steps:
      - env:
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
        run: |
          dnf -q install -y git
          git clone --quiet --depth 1 --branch "$TAG" "$REPO_URL" src
          cd src
          sh scripts/fedora-build-deps.sh
          export PATH="$CARGO_HOME/bin:$PATH" CARGO_TARGET_DIR="$PWD/target/fedora-x86_64"
          mkdir -p target/dist
          sh scripts/package-fedora-in-container.sh
          for file in target/dist/revisor-*.x86_64.rpm; do
            curl -fsS -o /dev/null -H "Authorization: token $TOKEN" -F "attachment=@$file" \
              "$API/releases/$RELEASE_ID/assets?name=$(basename "$file")"
          done

  arch:
    needs: draft
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - env:
          RELEASE_ID: ${{ needs.draft.outputs.id }}
          REVISOR_GITHUB_CLIENT_ID: ${{ secrets.REVISOR_GITHUB_CLIENT_ID }}
        run: |
          pacman -Syu --noconfirm --needed git curl
          git clone --quiet --depth 1 --branch "$TAG" "$REPO_URL" src
          cd src
          sh scripts/arch-build-deps.sh
          useradd -m builder
          chown -R builder:builder .
          su -s /bin/sh builder -c 'export HOME=/home/builder CARGO_TARGET_DIR="$PWD/target/arch-x86_64"; sh scripts/package-arch-in-container.sh'
          for file in target/dist/revisor-[0-9]*-x86_64.pkg.tar.zst; do
            curl -fsS -o /dev/null -H "Authorization: token $TOKEN" -F "attachment=@$file" \
              "$API/releases/$RELEASE_ID/assets?name=$(basename "$file")"
          done

  publish:
    needs: [draft, macos, fedora, arch]
    runs-on: ubuntu-latest
    container: alpine:3
    steps:
      - env:
          RELEASE_ID: ${{ needs.draft.outputs.id }}
        run: |
          apk add --no-cache curl
          curl -fsS -o /dev/null -X PATCH -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d '{"draft": false}' "$API/releases/$RELEASE_ID"
