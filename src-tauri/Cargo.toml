[package]
name = "revisor"
version = "1.0.0"
edition = "2021"

[lib]
name = "revisor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
revisor-core = { path = "../crates/revisor-core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
